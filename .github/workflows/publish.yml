name: Publish Extension

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout private src repo
        uses: actions/checkout@v4
        with:
          repository: FaizanAshiq/src
          path: src
          token: ${{ secrets.SRC_REPO_TOKEN }}
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build webview assets
        run: npm run build:webviews

      - name: Build preview CSS
        run: npm run build:css

      - name: Verify built outputs exist
        run: |
          echo "Version: $(node -p "require('./package.json').version")"
          test -f out/extension.js || { echo '❌ out/extension.js missing — run npm run pack locally first'; exit 1; }
          test -f media/preview.css || { echo '❌ media/preview.css missing — run npm run pack locally first'; exit 1; }
          test -f media/webviews/markdown/preview.html || { echo '❌ media/webviews missing — run npm run build:webviews before packaging'; exit 1; }
          test -f media/webviews/shared/panel-widget.html || { echo '❌ shared webview widget missing — build webviews before packaging'; exit 1; }
          ls themes/*.json > /dev/null 2>&1 || { echo '❌ theme JSONs missing — run npm run pack locally first'; exit 1; }
          echo '✓ All built outputs present'

      - name: Package extension
        run: npx @vscode/vsce@latest package --no-dependencies

      - name: Publish to marketplace
        run: npx @vscode/vsce@latest publish --no-dependencies --pat ${{ secrets.VSCE_PAT }}
